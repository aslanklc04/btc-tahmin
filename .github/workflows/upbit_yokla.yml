name: Upbit yoklama
on:
  push:
    branches: [arastirma3]
    paths: [upbit_yokla.py, .github/workflows/upbit_yokla.yml]
permissions:
  contents: write
jobs:
  y:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - run: pip install -q requests pandas && python upbit_yokla.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add upbit_yokla_sonuc.md && git commit -m "Upbit yoklama" || exit 0
          for i in 1 2 3; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 3; done
