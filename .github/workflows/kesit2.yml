name: Coin siralama testi (tum coinler)
on:
  push:
    branches: [arastirma3]
    paths: [kesit2.py, .github/workflows/kesit2.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          set +e; python kesit2.py > kesit2_log.txt 2>&1; echo "exit=$?" >> kesit2_log.txt; tail -40 kesit2_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add kesit2_log.txt; git add kesit2_sonuc.md 2>/dev/null; git commit -m "Coin siralama (tum coinler) sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
