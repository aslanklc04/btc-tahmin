name: Vadeli emir defteri borsa yoklamasi
on:
  push:
    branches: [arastirma3]
    paths: [borsa_yokla.py, .github/workflows/borsa_yokla.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          set +e; timeout 900 python -u borsa_yokla.py > borsa_yokla_log.txt 2>&1; echo "exit=$?" >> borsa_yokla_log.txt; tail -60 borsa_yokla_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add borsa_yokla_log.txt; git add borsa_yokla_sonuc.md 2>/dev/null || true; git commit -m "Borsa yoklamasi sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
