name: Uzun ufuk testi (8-24-72 saat)
on:
  push:
    branches: [arastirma3]
    paths: [ufuk24.py, ufuk24_rapor.py, .github/workflows/ufuk24.yml]
permissions:
  contents: write
jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      coinler: ${{ steps.l.outputs.coinler }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - id: l
        run: echo "coinler=$(python3 -c "import json; print(json.dumps(['BTCUSDT'] + open('durum/coin_listesi.txt').read().split()))")" >> "$GITHUB_OUTPUT"
  egit:
    needs: liste
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        sym: ${{ fromJSON(needs.liste.outputs.coinler) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          set +e; python ufuk24.py ${{ matrix.sym }} > log24_${{ matrix.sym }}.txt 2>&1; echo "exit=$?" >> log24_${{ matrix.sym }}.txt; tail -8 log24_${{ matrix.sym }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: u24-${{ matrix.sym }}
          path: |
            disa24_${{ matrix.sym }}.pkl
            log24_${{ matrix.sym }}.txt
          retention-days: 30
  rapor:
    needs: egit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: art
      - run: |
          set +e; for f in art/*/log24_*.txt; do echo "== $f"; tail -6 "$f"; done > ufuk24_log.txt
          python ufuk24_rapor.py >> ufuk24_log.txt 2>&1; echo "exit=$?" >> ufuk24_log.txt; tail -30 ufuk24_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ufuk24_log.txt; git add ufuk24_sonuc.md 2>/dev/null; git commit -m "Uzun ufuk testi sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
