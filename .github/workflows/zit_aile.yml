name: ABD coin aliyor BTC satiyor - aile bazinda
on:
  push:
    branches: [arastirma3]
    paths: [zit_aile.py, .github/workflows/zit_aile.yml]
permissions:
  contents: write
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/checkout@v4
        with:
          ref: main
          path: canli
          sparse-checkout: durum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: art1
          pattern: coin-*
          run-id: 37573562538
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: art2
          pattern: u24-*
          run-id: 37618956269
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: art3
          name: prim-veri
          run-id: 37771896586
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: sf-btc
          run-id: 37801388956
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set +e; python zit_aile.py > zit_aile_log.txt 2>&1; echo "exit=$?" >> zit_aile_log.txt; tail -30 zit_aile_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add zit_aile_log.txt; for f in zit_aile_sonuc.md; do git add $f 2>/dev/null || true; done; git commit -m "ABD coin aliyor BTC satiyor - aile bazinda sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
