name: Genis listede ek kurallar (fonlama, dip, momentum)
on:
  push:
    branches: [arastirma3]
    paths: [genis_hepsi.py, .github/workflows/genis_hepsi.yml]
permissions:
  contents: write
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/checkout@v4
        with:
          ref: main
          path: canli
          sparse-checkout: durum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Genis tarama artifact'leri
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38139240014 -R ${{ github.repository }} -p "g-*" -D ga && ls ga | wc -l
      - run: |
          set +e; timeout 4800 python -u genis_hepsi.py > genis_hepsi_log.txt 2>&1; echo "exit=$?" >> genis_hepsi_log.txt; tail -40 genis_hepsi_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add genis_hepsi_log.txt; for f in genis_hepsi_sonuc.md; do git add $f 2>/dev/null || true; done; git commit -m "Genis listede ek kurallar sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
