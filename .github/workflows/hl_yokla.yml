name: Hyperliquid yoklama (salt okuma)
on:
  push:
    branches: [arastirma3]
    paths: [hl_yokla_tetik.txt]
permissions:
  contents: write
jobs:
  y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - run: |
          pip install -q requests
          python hl_yokla.py > hl_yokla_log.txt 2>&1 || true; cut -c1-1200 hl_yokla_log.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add hl_yokla_log.txt; git commit -m "hl yoklama" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
