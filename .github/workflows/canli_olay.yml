name: Canli olay denetimi
on:
  push:
    branches: [arastirma3]
    paths: [canli_olay.py, .github/workflows/canli_olay.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
          path: a3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: |
          cp a3/canli_olay.py .
          set +e; timeout 6000 python -u canli_olay.py > a3/canli_olay_log.txt 2>&1; echo "exit=$?" >> a3/canli_olay_log.txt; tail -60 a3/canli_olay_log.txt
          cp canli_olay_sonuc.md a3/ 2>/dev/null || true
      - run: |
          cd a3
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add canli_olay_log.txt; git add canli_olay_sonuc.md 2>/dev/null || true; git commit -m "Canli olay denetimi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
