name: Copy Trading yoklama (Neon uzerinden, salt okuma)
on:
  push:
    branches: [arastirma3]
    paths: [kopya_yokla_tetik.txt]
permissions:
  contents: write
jobs:
  yokla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - run: |
          pip install -q requests
          python kopya_yokla.py > kopya_yokla_log.txt 2>&1; cat kopya_yokla_log.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add kopya_yokla_log.txt; git commit -m "kopya yoklama" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
