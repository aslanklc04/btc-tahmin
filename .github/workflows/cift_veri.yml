name: Cift duyuru govdeleri (Neon uzerinden)
on:
  push:
    branches: [arastirma3]
    paths: [cift_tetik.txt]
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - run: |
          pip install -q requests pandas
          python -u cift_veri.py > cift_veri_log.txt 2>&1 || true; head -c 1500 cift_veri_log.txt; tail -5 cift_veri_log.txt | cut -c1-300
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add cift_veri_log.txt; git add cift_govde.json 2>/dev/null || true; git commit -m "cift govdeleri" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
