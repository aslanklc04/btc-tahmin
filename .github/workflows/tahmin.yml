name: Saatlik tahmin
on:
  schedule:
    - cron: "7 * * * *"          # her saat başından 7 dakika sonra (saatlik mum kapandıktan sonra)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-durum
  cancel-in-progress: false
jobs:
  tahmin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tahmin geçmişini önbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/gecmis.pkl
          key: gecmis-${{ github.run_id }}
          restore-keys: gecmis-
      - run: python tahmin.py
        env:
          TELEGRAM_TOKEN: ${{ 8916558516:AAGXoDj-IyZrExcEUhuvlvxCTuEMtjfcrxw }}
          TELEGRAM_CHAT_ID: ${{ 8652978434}}
      - name: Tahmin geçmişini önbelleğe kaydet
        uses: actions/cache/save@v4
        with:
          path: durum/gecmis.pkl
          key: gecmis-${{ github.run_id }}
      - name: son_durum.md'yi depoya yaz
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add son_durum.md
          git commit -m "Saatlik durum" || echo "değişiklik yok"
          git pull --rebase && git push
