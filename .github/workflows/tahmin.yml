name: Saatlik tahmin
on:
  workflow_dispatch:          # her saat cron-job.org tetikler (23.10: :02'de geliyordu) (GitHub'ın kendi zamanlayıcısı ek çalışmalarla dakika kotasını harcadığı için kaldırıldı)
permissions:
  contents: write
concurrency:
  group: btc-durum
  cancel-in-progress: false
jobs:
  tahmin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TG_SIRALI: "1"            # mesajlar kuyruğa; sondaki gonder.py öncelik sırasıyla (en iyi sinyal üstte) gönderir
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # 25.10 denetim: aynı saatte kuyrukta bekleyen ikinci çalışma, birincinin kaydettiği son durumu görsün (tetikleme anındaki eski commit'i değil)
      - name: Genis coin modelleri (modeller dali; yoksa atlanir)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: modeller
          path: modeller
          fetch-depth: 1
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"
      - name: Python paketleri (önbellekten — her saat ~10 sn kazandırır)
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Gecmisi onbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/gecmis.pkl
          key: gecmis-${{ github.run_id }}
          restore-keys: gecmis-
      - id: btc
        continue-on-error: true   # 25.10 denetim: BTC adımı düşerse diğer sinyaller (coin, 🧪, 💵, ⛓️, 🧑) yine üretilsin; hata gonder.py uyarısında
        timeout-minutes: 8
        run: python tahmin.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Gecmisi onbellege kaydet
        if: hashFiles('durum/gecmis.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: durum/gecmis.pkl
          key: gecmis-${{ github.run_id }}
      - name: Likidite gecmisini onbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/derinlik_saat.pkl
          key: ldgecmis-${{ github.run_id }}
          restore-keys: ldgecmis-
      - name: 💧 likidite (Neon + Binance arsivi; durum/likidite_coinler.txt bossa kapali)
        id: likidite
        continue-on-error: true
        timeout-minutes: 8
        run: python likidite.py
      - name: Likidite gecmisini onbellege kaydet
        if: hashFiles('durum/derinlik_saat.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: durum/derinlik_saat.pkl
          key: ldgecmis-${{ github.run_id }}
      - name: Altcoin gecmisini onbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/gecmis_coin.pkl
          key: coingecmis-${{ github.run_id }}
          restore-keys: coingecmis-
      - name: Altcoin sinyalleri (durum/coin_listesi.txt)
        id: coin
        continue-on-error: true
        timeout-minutes: 12
        run: python tahmin_coin.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Altcoin gecmisini onbellege kaydet
        if: hashFiles('durum/gecmis_coin.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: durum/gecmis_coin.pkl
          key: coingecmis-${{ github.run_id }}
      - name: 24 saat deneme gecmisini onbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/gecmis24.pkl
          key: d24gecmis-${{ github.run_id }}
          restore-keys: d24gecmis-
      - name: 24 saat deneme sinyalleri (durum/model24_*.pkl.gz)
        id: d24
        continue-on-error: true
        timeout-minutes: 10
        run: python tahmin24.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 24 saat deneme gecmisini onbellege kaydet
        if: hashFiles('durum/gecmis24.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: durum/gecmis24.pkl
          key: d24gecmis-${{ github.run_id }}
      - name: Arz/talep gecmisini onbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/zincir.pkl
          key: zgecmis-${{ github.run_id }}
          restore-keys: zgecmis-
      - name: Gunluk arz/talep kontrolu (ETH; TR 09:00 sonrasi, gunde bir)
        id: zincir
        continue-on-error: true
        timeout-minutes: 4
        run: python zincir_canli.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Arz/talep gecmisini onbellege kaydet
        if: hashFiles('durum/zincir.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: durum/zincir.pkl
          key: zgecmis-${{ github.run_id }}
      - name: Kucuk yatirimci gecmisini onbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/kucuk.pkl
          key: kgecmis-${{ github.run_id }}
          restore-keys: kgecmis-
      - name: Kucuk yatirimci kontrolu (BTC; TR 15:00 sonrasi, gunde bir)
        id: kucuk
        continue-on-error: true
        timeout-minutes: 3
        run: python kucuk_canli.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 📆 D10 BTC gunluk (yalniz panel, izleme)
        id: d10
        continue-on-error: true
        timeout-minutes: 3
        run: python d10_canli.py
      - name: Kucuk yatirimci gecmisini onbellege kaydet
        if: hashFiles('durum/kucuk.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: durum/kucuk.pkl
          key: kgecmis-${{ github.run_id }}
      - name: Prim gecmisini onbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/prim.pkl
          key: pgecmis-${{ github.run_id }}
          restore-keys: pgecmis-
      - name: ABD guclu aliyor -> coin AL (kendi Coinbase primi, durum/prim_acik.csv)
        id: prim
        continue-on-error: true
        timeout-minutes: 5
        run: python prim_canli.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Prim gecmisini onbellege kaydet
        if: hashFiles('durum/prim.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: durum/prim.pkl
          key: pgecmis-${{ github.run_id }}
      - name: Telegram mesajlarini oncelik sirasiyla gonder (en iyi sinyal ustte)
        id: gonder
        if: always()
        continue-on-error: true   # 25.10 denetim: hata olsa da karne ve depoya kayıt adımları çalışsın
        timeout-minutes: 6
        run: python gonder.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADIMLAR: "btc=${{ steps.btc.outcome }} coin=${{ steps.coin.outcome }} d24=${{ steps.d24.outcome }} zincir=${{ steps.zincir.outcome }} kucuk=${{ steps.kucuk.outcome }} prim=${{ steps.prim.outcome }} likidite=${{ steps.likidite.outcome }} d10=${{ steps.d10.outcome }}"   # karne artık gönderimden sonra; hatası ayrı adımda uyarılır
      - name: 📒 canli karne (23.10.2026 gonderimden SONRA — sinyaller ~2,5 dk erken gider; mesajlari kuyruga degil dogrudan)
        id: karne
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: python karne.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_SIRALI: ""            # gonder.py bitti: haftalik karne / panelden durdurma mesaji dogrudan gider
      - name: 📏 gercekci karne + golge izleme (24.10.2026; yalniz olcum, sinyallere dokunmaz)
        id: kgercek
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: python karne_gercek.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_SIRALI: ""
      - name: 🪡 igne donusu golge izleme (27.10.2026; mesaj gondermez, yalniz kayit)
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: python igne_golge.py
      - name: 🏦 borsadan cikis golge izleme (28.10.2026; mesaj gondermez, yalniz kayit)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: python borsa_golge.py
      - name: Karne hata verdiyse uyar
        if: always() && (steps.karne.outcome == 'failure' || steps.kgercek.outcome == 'failure' || steps.gonder.outcome == 'failure')
        continue-on-error: true
        run: python -c "from ortak import tg_send; import os; tg_send('⚠️ SİSTEM UYARISI — bu saat ' + ('📨 GÖNDERME adımı hata verdi — bazı sinyaller gitmemiş olabilir' if os.environ.get('GO') == 'failure' else '📒 karne ya da 📏 gerçekçi karne adımı hata verdi (sinyaller gönderildi; yalnız karne güncellenmedi)') + '. Düzeltilene kadar her saat tekrar eder.')"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_SIRALI: ""
          GO: ${{ steps.gonder.outcome }}
      - name: son_durum.md depoya yaz
        if: always()   # 25.10 denetim: önceki bir adım düşse de karne kayıtları depoya yazılsın
        run: |
          [ -f son_durum.md ] || exit 0
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add son_durum.md; git add durum/defter_kayit.csv 2>/dev/null || true; git add durum/gun_durum.json 2>/dev/null || true; for f in durum/karne_kayit.csv durum/karne.md durum/karne_durum.json durum/haftalik_rapor.md durum/d10_durum.json durum/kaynak_tazelik.json durum/panelden_dur.json durum/karne_gercek.csv durum/karne_gercek.md durum/karne_gercek_durum.json durum/beklenen.csv durum/igne_golge.csv durum/igne_golge.md durum/igne_golge_durum.json durum/borsa_golge.csv durum/borsa_golge.md durum/borsa_golge_durum.json; do git add $f 2>/dev/null || true; done
          git commit -m "Saatlik durum" || echo "degisiklik yok"
          ok=0; for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && ok=1 && break; sleep 5; done   # aynı saatte iki çalışma olursa panelin yenisi kalır
          [ $ok = 1 ] || { echo '::error::panel depoya gönderilemedi'; exit 1; }
