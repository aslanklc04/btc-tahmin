name: Saatlik tahmin
on:
  workflow_dispatch:          # her saat :05'te cron-job.org tetikler (GitHub'ın kendi zamanlayıcısı ek çalışmalarla dakika kotasını harcadığı için kaldırıldı)
permissions:
  contents: write
concurrency:
  group: btc-durum
  cancel-in-progress: false
jobs:
  tahmin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TG_SIRALI: "1"            # mesajlar kuyruğa; sondaki gonder.py öncelik sırasıyla (en iyi sinyal üstte) gönderir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"
      - name: Python paketleri (önbellekten — her saat ~10 sn kazandırır)
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Gecmisi onbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/gecmis.pkl
          key: gecmis-${{ github.run_id }}
          restore-keys: gecmis-
      - run: python tahmin.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Gecmisi onbellege kaydet
        if: hashFiles('durum/gecmis.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: durum/gecmis.pkl
          key: gecmis-${{ github.run_id }}
      - name: Altcoin gecmisini onbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/gecmis_coin.pkl
          key: coingecmis-${{ github.run_id }}
          restore-keys: coingecmis-
      - name: Altcoin sinyalleri (durum/coin_listesi.txt)
        continue-on-error: true
        timeout-minutes: 6
        run: python tahmin_coin.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Altcoin gecmisini onbellege kaydet
        if: hashFiles('durum/gecmis_coin.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: durum/gecmis_coin.pkl
          key: coingecmis-${{ github.run_id }}
      - name: 24 saat deneme gecmisini onbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/gecmis24.pkl
          key: d24gecmis-${{ github.run_id }}
          restore-keys: d24gecmis-
      - name: 24 saat deneme sinyalleri (durum/model24_*.pkl.gz)
        continue-on-error: true
        timeout-minutes: 5
        run: python tahmin24.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 24 saat deneme gecmisini onbellege kaydet
        if: hashFiles('durum/gecmis24.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: durum/gecmis24.pkl
          key: d24gecmis-${{ github.run_id }}
      - name: Arz/talep gecmisini onbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/zincir.pkl
          key: zgecmis-${{ github.run_id }}
          restore-keys: zgecmis-
      - name: Gunluk arz/talep kontrolu (ETH; TR 09:00 sonrasi, gunde bir)
        continue-on-error: true
        timeout-minutes: 4
        run: python zincir_canli.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Arz/talep gecmisini onbellege kaydet
        if: hashFiles('durum/zincir.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: durum/zincir.pkl
          key: zgecmis-${{ github.run_id }}
      - name: Kucuk yatirimci gecmisini onbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/kucuk.pkl
          key: kgecmis-${{ github.run_id }}
          restore-keys: kgecmis-
      - name: Kucuk yatirimci kontrolu (BTC; TR 15:00 sonrasi, gunde bir)
        continue-on-error: true
        timeout-minutes: 3
        run: python kucuk_canli.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Kucuk yatirimci gecmisini onbellege kaydet
        if: hashFiles('durum/kucuk.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: durum/kucuk.pkl
          key: kgecmis-${{ github.run_id }}
      - name: Prim gecmisini onbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/prim.pkl
          key: pgecmis-${{ github.run_id }}
          restore-keys: pgecmis-
      - name: ABD guclu aliyor -> coin AL (kendi Coinbase primi, durum/prim_acik.csv)
        continue-on-error: true
        timeout-minutes: 5
        run: python prim_canli.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Prim gecmisini onbellege kaydet
        if: hashFiles('durum/prim.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: durum/prim.pkl
          key: pgecmis-${{ github.run_id }}
      - name: Telegram mesajlarini oncelik sirasiyla gonder (en iyi sinyal ustte)
        if: always()
        timeout-minutes: 3
        run: python gonder.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: son_durum.md depoya yaz
        run: |
          [ -f son_durum.md ] || exit 0
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add son_durum.md; git add durum/defter_kayit.csv 2>/dev/null || true
          git commit -m "Saatlik durum" || echo "degisiklik yok"
          ok=0; for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && ok=1 && break; sleep 5; done   # aynı saatte iki çalışma olursa panelin yenisi kalır
          [ $ok = 1 ] || { echo '::error::panel depoya gönderilemedi'; exit 1; }
