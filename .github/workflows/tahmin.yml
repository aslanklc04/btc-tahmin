name: Saatlik tahmin
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-durum
  cancel-in-progress: false
jobs:
  tahmin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gecmisi onbellekten al
        uses: actions/cache/restore@v4
        with:
          path: durum/gecmis.pkl
          key: gecmis-${{ github.run_id }}
          restore-keys: gecmis-
      - run: python tahmin.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Gecmisi onbellege kaydet
        if: hashFiles('durum/gecmis.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: durum/gecmis.pkl
          key: gecmis-${{ github.run_id }}
      - name: son_durum.md depoya yaz
        run: |
          [ -f son_durum.md ] || exit 0
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add son_durum.md
          git commit -m "Saatlik durum" || echo "degisiklik yok"
          git pull --rebase && git push
