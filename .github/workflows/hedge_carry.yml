name: BTC korumali + fonlama kazanci (PROTOKOL_hedge_carry)
on:
  push:
    branches: [arastirma3]
    paths: [hedge_carry.py, .github/workflows/hedge_carry.yml]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - uses: actions/checkout@v4
        with: {ref: main, path: canli}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -q -r canli/requirements.txt
      - run: |
          set +e; python -u hedge_carry.py > hedge_carry_log.txt 2>&1; echo "exit=$?" >> hedge_carry_log.txt; tail -40 hedge_carry_log.txt
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add hedge_carry_log.txt; for f in hedge_carry_sonuc.md; do git add $f 2>/dev/null || true; done; git commit -m "Hedge-carry sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
