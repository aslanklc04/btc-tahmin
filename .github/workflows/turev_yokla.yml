name: Vadeli arsiv yoklamasi
on:
  push:
    branches: [arastirma3]
    paths: [turev_yokla.py, .github/workflows/turev_yokla.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          set +e; python turev_yokla.py > turev_yokla_log.txt 2>&1; echo "exit=$?" >> turev_yokla_log.txt; tail -40 turev_yokla_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add turev_yokla_log.txt; git add turev_yokla.md 2>/dev/null; git commit -m "Vadeli arsiv yoklamasi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
