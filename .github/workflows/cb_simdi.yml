name: Coinbase primi simdi
on:
  push:
    branches: [arastirma3]
    paths: [cb_simdi.py, ortak_canli.py, .github/workflows/cb_simdi.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          set +e; python cb_simdi.py > cb_simdi_log.txt 2>&1; echo "exit=$?" >> cb_simdi_log.txt; tail -60 cb_simdi_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add cb_simdi_log.txt; git add cb_simdi_sonuc.md 2>/dev/null || true; git commit -m "Coinbase primi simdi sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
