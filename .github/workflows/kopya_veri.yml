name: Copy Trading verisi (Neon uzerinden)
on:
  push:
    branches: [arastirma3]
    paths: [kopya_veri_tetik.txt]
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          pip install -q requests pandas pyarrow numpy
          python -u kopya_veri.py 2>&1 | tee kopya_veri_log.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add kopya_veri_log.txt kopya_meta.parquet kopya_roi.parquet; git commit -m "Copy Trading verisi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
