name: Aylik egitim (altcoin)
on:
  schedule:
    - cron: "30 2 1 * *"
  workflow_dispatch:
    inputs:
      test_liste:
        description: "Deneme için virgülle coin listesi (boşsa durum/coin_listesi.txt)"
        required: false
        default: ""
permissions:
  contents: write
  actions: read
jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      coinler: ${{ steps.l.outputs.coinler }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          L="${{ inputs.test_liste }}"; [ -n "$L" ] || L=$(paste -sd, durum/coin_listesi.txt)
          G=""; [ -n "${{ inputs.test_liste }}" ] || G=$(cat durum/genis_liste.txt 2>/dev/null | paste -sd,)          # 🌐 geniş liste (modeller dalı) da eğitilir
          echo "coinler=$(python3 -c "import json,sys; a=['BTCUSDT'] + [x.strip() for x in sys.argv[1].split(',') if x.strip()]; g=[x for x in sys.argv[2].split(',') if x and x not in a]; print(json.dumps([dict(sym=x, g=0) for x in a] + [dict(sym=x, g=1) for x in g]))" "$L" "$G")" >> "$GITHUB_OUTPUT"
  egit:
    needs: liste
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        c: ${{ fromJSON(needs.liste.outputs.coinler) }}
      max-parallel: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python egit_coin.py ${{ matrix.c.sym }}
        env:
          DISA_AKTAR: "1"
          TELEGRAM_TOKEN: ${{ github.ref_name == 'main' && matrix.c.sym != 'BTCUSDT' && matrix.c.g == 0 && secrets.TELEGRAM_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ github.ref_name == 'main' && secrets.TELEGRAM_CHAT_ID || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: coin-${{ matrix.c.sym }}
          path: |
            durum/model_${{ matrix.c.sym }}.pkl.gz
            durum/rapor_${{ matrix.c.sym }}.md
            disa_${{ matrix.c.sym }}.pkl
          retention-days: 10
  ortak:
    needs: egit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Egitim ciktilarini indir (gh, sayfalamali — 100+ coin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} -R ${{ github.repository }} -p "coin-*" -D art && ls art | wc -l
      - name: 🌐 Genis liste modellerini modeller dalina yaz
        if: inputs.test_liste == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./modeller_yaz.sh art model_
      - run: python ortak_analiz.py && python coin_sec.py
        env:
          TELEGRAM_TOKEN: ${{ github.ref_name == 'main' && secrets.TELEGRAM_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ github.ref_name == 'main' && secrets.TELEGRAM_CHAT_ID || '' }}
      - name: Modelleri ve ortak listeyi depoya kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add durum/model_*.pkl.gz durum/rapor_*.md durum/ortak_acik.csv durum/tek_acik.csv durum/ortak_rapor.md
          git commit -m "Aylik egitim (altcoin + ortak sinyal denetimi)" || exit 0
          ok=0; for i in 1 2 3 4 5 6; do git pull --rebase --autostash -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && ok=1 && break; sleep $((i*5)); done; [ $ok = 1 ] || { echo '::error::modeller depoya gönderilemedi'; exit 1; }
