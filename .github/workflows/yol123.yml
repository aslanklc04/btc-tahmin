name: Yol123 - para yonetimi, yurutme, rejim (PROTOKOL_dortyol)
on:
  push:
    branches: [arastirma3]
    paths: [yol123.py, .github/workflows/yol123.yml]
permissions:
  contents: write
jobs:
  kos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - run: pip install -q requests pandas numpy
      - run: |
          set +e; python -u yol123.py > yol123_log.txt 2>&1; echo "exit=$?" >> yol123_log.txt; tail -60 yol123_log.txt
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add yol123_log.txt; git add yol123_sonuc.md 2>/dev/null || true; git commit -m "Yol123 sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
