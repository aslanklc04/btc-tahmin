name: Denetim - artifact incele
on:
  push:
    branches: [denetim]
    paths: [dt/incele.py, .github/workflows/incele.yml]
permissions:
  contents: write
  actions: read
jobs:
  incele:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: main, path: canli}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q -r canli/requirements.txt
      - uses: actions/download-artifact@v4
        with: {path: art1, pattern: "coin-*", run-id: 38550403442, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/download-artifact@v4
        with: {path: art2, pattern: "u24-*", run-id: 37618956269, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/download-artifact@v4
        with: {path: art3, name: prim-veri, run-id: 39794193473, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/download-artifact@v4
        with: {path: art4, name: sf-btc, run-id: 37801388956, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: gh run download 38139240014 -R ${{ github.repository }} -p "g-*" -D ga
      - run: python -u dt/incele.py > dt/incele_sonuc.txt 2>&1; tail -50 dt/incele_sonuc.txt
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add dt/incele_sonuc.txt; git commit -m "incele sonucu" || exit 0
          for i in 1 2 3; do git pull --rebase origin denetim && git push origin HEAD:denetim && break; sleep 5; done
