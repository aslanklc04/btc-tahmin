name: Zincir ustu yatirimci kucuk_coini
on:
  push:
    branches: [arastirma3]
    paths: [kucuk_coin.py, .github/workflows/kucuk_coin.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          set +e; python kucuk_coin.py > kucuk_coin_log.txt 2>&1; echo "exit=$?" >> kucuk_coin_log.txt; tail -60 kucuk_coin_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add kucuk_coin_log.txt; git add veri_bgeo 2>/dev/null || true; git add kucuk_coin_sonuc.md 2>/dev/null || true; git commit -m "Yatirimci kucuk_coini sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
