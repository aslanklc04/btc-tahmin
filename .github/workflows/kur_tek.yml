name: Kurulum (BTC sessizken listesi)
on:
  push:
    branches: [main]
    paths: [.github/workflows/kur_tek.yml]
permissions:
  contents: write
  actions: read
jobs:
  kur:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: art
          run-id: 37573562538
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python ortak_analiz.py && python coin_sec.py --ilk && cat durum/coin_listesi.txt && cat durum/tek_acik.csv
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add durum/ && git commit -m "Kurulum: BTC sessizken coin sinyalleri listesi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 5; done
