name: Ortak sinyal analizi
on:
  push:
    branches: [tarama]
    paths: [.github/workflows/ortak_analiz.yml, ortak_analiz.py]
permissions:
  contents: write
  actions: read
jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarama
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: art
          run-id: 37573562538
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python ortak_analiz.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ortak_sonuc.md ortak_acik.csv && git commit -m "Ortak sinyal analizi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin tarama && git push origin HEAD:tarama && break; sleep 5; done
