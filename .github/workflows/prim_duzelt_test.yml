name: Prim duzeltme testi
on:
  push:
    branches: [arastirma3]
    paths: [prim_duzelt_test.py, .github/workflows/prim_duzelt_test.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/checkout@v4
        with:
          ref: prim-duzelt
          path: yeni
      - uses: actions/checkout@v4
        with:
          ref: main
          path: eski
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r yeni/requirements.txt
      - run: |
          set +e; timeout 8000 python -u prim_duzelt_test.py > prim_duzelt_log.txt 2>&1; echo "exit=$?" >> prim_duzelt_log.txt; tail -30 prim_duzelt_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add prim_duzelt_log.txt; git add prim_duzelt_sonuc.md 2>/dev/null || true; git commit -m "Prim duzeltme testi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
