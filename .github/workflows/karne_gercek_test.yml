name: Karne gercek kuru test
on:
  push:
    branches: [arastirma3]
    paths: [.github/workflows/karne_gercek_test.yml]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
          path: a3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: |
          set +e; S=$(date +%s); timeout 900 python karne_gercek.py > kg_log.txt 2>&1; echo "exit=$? sure=$(( $(date +%s) - S )) sn" >> kg_log.txt; tail -40 kg_log.txt
          S=$(date +%s); timeout 900 python karne_gercek.py > kg_log2.txt 2>&1; echo "ikinci (önbellekli) exit=$? sure=$(( $(date +%s) - S )) sn" >> kg_log.txt
          cp kg_log.txt a3/karne_gercek_test_log.txt; cp durum/karne_gercek.md a3/karne_gercek_test.md 2>/dev/null; cp durum/karne_gercek.csv a3/karne_gercek_test.csv 2>/dev/null
      - run: |
          cd a3; git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add karne_gercek_test_log.txt karne_gercek_test.md karne_gercek_test.csv 2>/dev/null; git commit -m "Karne gercek kuru test" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
