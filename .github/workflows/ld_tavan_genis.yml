name: Likidite tavanda genis liste
on:
  push:
    branches: [arastirma3]
    paths: [ld_tavan_genis.py, .github/workflows/ld_tavan_genis.yml]
permissions:
  contents: write
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/checkout@v4
        with:
          ref: main
          path: canli
          sparse-checkout: durum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Artifact'ler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38139240014 -R ${{ github.repository }} -p "g-*" -D ga && ls ga | wc -l
          gh run download 38278019690 -R ${{ github.repository }} -p "dparca-*" -D dart && ls dart | wc -l
      - run: |
          set +e; timeout 3000 python -u ld_tavan_genis.py > ld_tavan_genis_log.txt 2>&1; echo "exit=$?" >> ld_tavan_genis_log.txt; tail -30 ld_tavan_genis_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ld_tavan_genis_log.txt; for f in ld_tavan_genis_sonuc.md; do git add $f 2>/dev/null || true; done; git commit -m "Likidite tavanda genis sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
