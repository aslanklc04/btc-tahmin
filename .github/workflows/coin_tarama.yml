name: Coin taramasi
on:
  push:
    branches: [tarama]
    paths: [.github/workflows/coin_tarama.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  egit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sym: [BTCUSDT, ETHUSDT, BNBUSDT, DOGEUSDT, SHIBUSDT, PEPEUSDT, FLOKIUSDT, BONKUSDT, WIFUSDT, NEARUSDT, AVAXUSDT, DOTUSDT, LINKUSDT, ADAUSDT, INJUSDT, FETUSDT, SUIUSDT, APTUSDT, ARBUSDT, OPUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python egit_coin.py ${{ matrix.sym }}
        env:
          DISA_AKTAR: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: coin-${{ matrix.sym }}
          path: |
            durum/model_${{ matrix.sym }}.pkl.gz
            durum/rapor_${{ matrix.sym }}.md
            disa_${{ matrix.sym }}.pkl
          retention-days: 7
  rapor:
    needs: egit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarama
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: art
      - run: python tarama_rapor.py
      - name: Sonucu ve secilen modelleri tarama dalina yaz
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tarama_sonuc.md secilen_coinler.txt durum/model_*.pkl.gz durum/rapor_*.md
          git commit -m "Coin taramasi sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin tarama && git push origin HEAD:tarama && break; sleep 5; done
