name: Model + Coinbase primi birlesimi
on:
  push:
    branches: [arastirma3]
    paths: [birlesim.py, .github/workflows/birlesim.yml]
permissions:
  contents: write
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: art1
          pattern: coin-*
          run-id: 37573562538
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: art2
          pattern: u24-*
          run-id: 37618956269
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set +e; python birlesim.py > birlesim_log.txt 2>&1; echo "exit=$?" >> birlesim_log.txt; tail -40 birlesim_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add birlesim_log.txt; git add birlesim_sonuc.md 2>/dev/null; git commit -m "Model + Coinbase primi sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
