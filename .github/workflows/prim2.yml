name: Kendi primi canli hazirlik
on:
  push:
    branches: [arastirma3]
    paths: [prim2.py, .github/workflows/prim2.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: prim-veri
          run-id: 37771896586
          github-token: ${{ github.token }}
      - run: |
          set +e; python prim2.py > prim2_log.txt 2>&1; echo "exit=$?" >> prim2_log.txt; tail -60 prim2_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add prim2_log.txt; git add prim_acik.csv 2>/dev/null || true; git add prim2_sonuc.md 2>/dev/null || true; git commit -m "Kendi primi canli hazirlik sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
