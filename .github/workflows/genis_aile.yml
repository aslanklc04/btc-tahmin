name: Genis tarama aile duzeyi
on:
  push:
    branches: [arastirma3]
    paths: [genis_aile.py, .github/workflows/genis_aile.yml]
permissions:
  contents: write
  actions: read
jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - uses: actions/checkout@v4
        with:
          ref: main
          path: canli
          sparse-checkout: durum
      - uses: actions/download-artifact@v4
        with:
          path: ga
          pattern: g-[0-9A-O]*
          run-id: 38139240014
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: ga
          pattern: g-[P-Z]*
          run-id: 38139240014
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          ls ga | wc -l; set +e; timeout 2000 python -u genis_aile.py > genis_aile_log.txt 2>&1; echo "exit=$?" >> genis_aile_log.txt; tail -30 genis_aile_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add genis_aile_log.txt; for f in genis_aile_sonuc.md; do git add $f 2>/dev/null || true; done; git commit -m "Genis tarama aile duzeyi sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
