name: Gunluk sinyal taramasi
on:
  push:
    branches: [arastirma3]
    paths: [gunluk.py, .github/workflows/gunluk.yml]
permissions:
  contents: write
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: art3
          name: prim-veri
          run-id: 37771896586
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set +e; timeout 6000 python -u gunluk.py > gunluk_log.txt 2>&1; echo "exit=$?" >> gunluk_log.txt; tail -40 gunluk_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add gunluk_log.txt; git add gunluk_sonuc.md 2>/dev/null || true; git commit -m "Gunluk sinyal taramasi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
