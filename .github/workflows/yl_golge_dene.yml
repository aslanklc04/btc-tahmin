name: Listeleme golgesi deneme (arastirma3)
on:
  push:
    branches: [arastirma3]
    paths: [yl_golge_dene_tetik.txt]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          pip install -q requests pandas numpy
          mkdir -p durum; rm -f durum/yeniliste_*
          set +e
          { echo "== 1. ilk çalışma (başlatma)"; python yeniliste_golge_dene.py
            echo "== 2. bilinen'den 5 yakın coin çıkarıldı, BAŞLA 2026-09-01"; grep -v -x -E "CTUSDT|PONSUSDT|MARSCOINUSDT|GRVTUSDT|DOSUSDT" durum/yeniliste_bilinen.txt > b && mv b durum/yeniliste_bilinen.txt
            YL_BASLA=2026-09-01 python yeniliste_golge_dene.py
            echo "== 3. ikinci kez (değişmemeli)"; YL_BASLA=2026-09-01 python yeniliste_golge_dene.py
            echo "== kayıt"; cat durum/yeniliste_golge.csv; echo "== özet"; cat durum/yeniliste_golge.md; } > yl_golge_dene_log.txt 2>&1
          cat yl_golge_dene_log.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add yl_golge_dene_log.txt; git commit -m "listeleme gölgesi deneme" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
