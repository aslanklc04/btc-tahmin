name: Denetim - analiz
on:
  push:
    branches: [denetim]
    paths: [dt/analiz.py, dt/canli.py, dt/veri_run.txt, .github/workflows/analiz.yml]
permissions:
  contents: write
  actions: read
jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: main, path: canli}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q -r canli/requirements.txt
      - id: v
        run: echo "id=$(cat dt/veri_run.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: {path: dveri, pattern: "dveri-*", run-id: "${{ steps.v.outputs.id }}", github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/download-artifact@v4
        with: {path: art1, pattern: "coin-*", run-id: 38550403442, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/download-artifact@v4
        with: {path: art2, pattern: "u24-*", run-id: 37618956269, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/download-artifact@v4
        with: {path: art3, name: prim-veri, run-id: 39794193473, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/download-artifact@v4
        with: {path: art4, name: sf-btc, run-id: 37801388956, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: gh run download 38139240014 -R ${{ github.repository }} -p "g-*" -D ga
      - run: |
          set +e; timeout 2400 python -u dt/canli.py > dt/canli_log.txt 2>&1; echo "exit=$?" >> dt/canli_log.txt; tail -60 dt/canli_log.txt
      - run: |
          if git log -1 --format=%B | grep -q "\[analiz\]"; then set +e; timeout 6000 python -u dt/analiz.py > dt/analiz_log.txt 2>&1; echo "exit=$?" >> dt/analiz_log.txt; tail -80 dt/analiz_log.txt; fi
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add dt/*_log.txt; for f in dt/canli_sonuc.md dt/analiz_sonuc.md dt/canli_olaylar.csv dt/gecmis_olaylar.csv.gz; do git add $f 2>/dev/null || true; done
          git commit -m "Denetim analiz sonucu" || exit 0
          for i in 1 2 3; do git pull --rebase origin denetim && git push origin HEAD:denetim && break; sleep 5; done
