name: Karne deneme
on:
  push:
    branches: [arastirma3]
    paths: [karne_dene/**, .github/workflows/karne_dene.yml]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: m}
      - uses: actions/checkout@v4
        with: {ref: arastirma3, path: a}
      - run: pip install -q -r m/requirements.txt
      - run: |
          cp a/karne_dene/karne.py m/
          cd m && TG_SIRALI=1 KARNE_ZORLA=1 python karne.py > ../a/karne_dene/cikti.txt 2>&1 || true
          cp durum/karne.md ../a/karne_dene/ 2>/dev/null; python -c "import json;[print(x['m']) for x in json.load(open('durum/tg_kuyruk.json'))]" > ../a/karne_dene/tg.txt 2>&1 || true
      - run: |
          cd a; git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add karne_dene && git commit -m "Karne deneme sonucu" || exit 0
          for i in 1 2 3; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 3; done
