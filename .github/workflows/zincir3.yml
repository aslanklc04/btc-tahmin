name: Arz talep canli kontrol
on:
  push:
    branches: [arastirma3]
    paths: [zincir3.py, zincir_canli.py, .github/workflows/zincir3.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          set +e; python zincir3.py > zincir3_log.txt 2>&1; echo "exit=$?" >> zincir3_log.txt; tail -40 zincir3_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add zincir3_log.txt; git add zincir3_sonuc.md 2>/dev/null; git commit -m "Arz talep canli kontrol sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
