name: Esik 70
on:
  push:
    branches: [arastirma3]
    paths: [esik70.py, .github/workflows/esik70.yml]
permissions:
  contents: write
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/checkout@v4
        with:
          ref: main
          path: canli
          sparse-checkout: durum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: art1
          pattern: coin-*
          run-id: 38550403442
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: art2
          pattern: u24-*
          run-id: 37618956269
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: art3
          name: prim-veri
          run-id: 39794193473
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: sf-btc
          run-id: 37801388956
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Genis tarama artifact'leri
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38139240014 -R ${{ github.repository }} -p "g-*" -D ga && ls ga | wc -l
      - run: |
          set +e; timeout 6000 python -u esik70.py > esik70_log.txt 2>&1; echo "exit=$?" >> esik70_log.txt; tail -30 esik70_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add esik70_log.txt; for f in esik70_sonuc.md; do git add $f 2>/dev/null || true; done; git commit -m "Karal" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
