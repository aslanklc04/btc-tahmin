name: GARCH3 veri
on:
  push:
    branches: [arastirma3]
    paths: [garch3_veri.py, .github/workflows/garch3_veri.yml]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - run: pip install -q requests pandas numpy
      - run: |
          set +e; timeout 13500 python -u garch3_veri.py > garch3_veri_log.txt 2>&1; echo "exit=$?" >> garch3_veri_log.txt; tail -20 garch3_veri_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add garch3_veri_log.txt; for f in garch3_veri.csv.gz garch3_veri_ozet.md; do git add $f 2>/dev/null || true; done; git commit -m "GARCH3 veri" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
