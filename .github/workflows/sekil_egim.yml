name: Sekil ek analiz (yon egimi)
on:
  push:
    branches: [arastirma3]
    paths: [sekil_egim.py, .github/workflows/sekil_egim.yml]
permissions:
  contents: write
  actions: read
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - uses: actions/download-artifact@v4
        with: {path: parca, pattern: "sekil-p-*", run-id: 40167335299, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - run: pip install -q pandas numpy && python sekil_egim.py | tail -60
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add sekil_egim_sonuc.md; git commit -m "Sekil yon egimi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
