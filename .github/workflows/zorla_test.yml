name: Zorla sinyal kuru test (canli kod, gonderilmez)
# canli kuru test (yedek yeniden 16.10: canli-test dalı)
on:
  push:
    branches: [arastirma3]
    paths: [.github/workflows/zorla_test.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TG_SIRALI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canli-test
      - name: modeller dali (sure olcumu)
        run: |
          T=$(date +%s); git clone -q --depth 1 -b modeller https://github.com/${{ github.repository }}.git modeller; echo "modeller indirme $(( $(date +%s) - T )) sn"; ls modeller | wc -l
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: durum/gecmis.pkl
          key: gecmis-x
          restore-keys: gecmis-
      - uses: actions/cache/restore@v4
        with:
          path: durum/gecmis_coin.pkl
          key: coingecmis-x
          restore-keys: coingecmis-
      - uses: actions/cache/restore@v4
        with:
          path: durum/gecmis24.pkl
          key: d24gecmis-x
          restore-keys: d24gecmis-
      - name: Zorla testler
        run: |
          set +e
          {
          hata() { grep -i "Traceback\|Error\|exception" -A6 "$1" | head -14; }
          echo "=== tahmin.py (gerçek)"; timeout 600 python tahmin.py > /tmp/b.txt 2>&1; echo "exit=$?"; hata /tmp/b.txt
          echo "=== likidite.py (liste boş → kapalı)"; timeout 300 python likidite.py > /tmp/l.txt 2>&1; echo "exit=$?"; hata /tmp/l.txt; cat durum/likidite_z.json; echo
          echo "=== tahmin_coin.py TEST_ZORLA=1"; TEST_ZORLA=1 timeout 600 python tahmin_coin.py > /tmp/c1.txt 2>&1; echo "exit=$?"; hata /tmp/c1.txt
          echo "=== tahmin_coin.py TEST_ZORLA=zit"; TEST_ZORLA=zit timeout 600 python tahmin_coin.py > /tmp/c2.txt 2>&1; echo "exit=$?"; hata /tmp/c2.txt
          echo "=== tahmin24.py TEST_ZORLA=1"; TEST_ZORLA=1 timeout 400 python tahmin24.py > /tmp/d1.txt 2>&1; echo "exit=$?"; hata /tmp/d1.txt
          echo "=== zincir_canli.py kuru"; ZINCIR_KURU=1 timeout 240 python zincir_canli.py > /tmp/z.txt 2>&1; echo "exit=$?"; hata /tmp/z.txt; tail -3 /tmp/z.txt
          echo "=== kucuk_canli.py kuru"; KUCUK_KURU=1 timeout 180 python kucuk_canli.py > /tmp/k1.txt 2>&1; echo "exit=$?"; hata /tmp/k1.txt; tail -3 /tmp/k1.txt
          echo "=== prim_canli.py kuru"; PRIM_KURU=1 timeout 300 python prim_canli.py > /tmp/p1.txt 2>&1; echo "exit=$?"; hata /tmp/p1.txt
          echo "=== karne.py"; timeout 240 python karne.py > /tmp/k.txt 2>&1; echo "exit=$?"; hata /tmp/k.txt; head -9 durum/karne.md
          echo "=== hata dosyası"; cat durum/adim_hata.txt 2>/dev/null
          echo "=== kuyruk özeti (sınıf · öncelik · etiket)"; python -c "
          import json
          for m in json.load(open('durum/tg_kuyruk.json')): print(m.get('c'), '·', round(m['o']), '·', m['e'][:140])
          "
          cp durum/tg_kuyruk.json /tmp/q.json
          echo "=== SENARYO A: 🔥 YOK (TEST_FZ=0)"
          rm -f durum/gun_durum.json; TEST_FZ=0 ADIMLAR="btc=success coin=success d24=success karne=success" python -c "
          import gonder
          def _g(m):
              print('──── GÖNDER ────'); print(m.split(chr(10))[0][:160]); return True
          gonder.tg_send = _g
          gonder.main()
          "
          echo "=== SENARYO B: 🔥 VAR (TEST_FZ=2.5) — ilk 3 mesaj tam"
          cp /tmp/q.json durum/tg_kuyruk.json; rm -f durum/gun_durum.json; TEST_FZ=2.5 python -c "
          import gonder
          n = [0]
          def _g(m):
              n[0] += 1; print('──── GÖNDER ────'); print(m[:2500] if n[0] <= 3 else m.split(chr(10))[0][:160]); return True
          gonder.tg_send = _g
          gonder.main()
          "
          echo "=== SENARYO C: hata uyarısı (karne=failure)"
          echo "[]" > durum/tg_kuyruk.json; ADIMLAR="btc=success karne=failure" python -c "
          import gonder
          def _g(m):
              print('──── GÖNDER ────'); print(m[:300]); return True
          gonder.tg_send = _g
          gonder.main()
          "
          echo "=== karne kaydı (son 8)"; tail -8 durum/karne_kayit.csv | cut -c1-160
          } > zorla_log.txt 2>&1
          cat zorla_log.txt | head -150
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
          path: ar
      - run: |
          cp zorla_log.txt ar/ && cd ar
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add zorla_log.txt; git commit -m "Zorla sinyal kuru test sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
