name: Zorla sinyal kuru test (canli kod, gonderilmez)
# canli kuru test (🚀 momentum + 📉🔥 dip önceliği: canli-test dalı)
on:
  push:
    branches: [arastirma3]
    paths: [.github/workflows/zorla_test.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TG_SIRALI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canli-test
      - name: modeller dali (sure olcumu)
        run: |
          T=$(date +%s); git clone -q --depth 1 -b modeller https://github.com/${{ github.repository }}.git modeller; echo "modeller indirme $(( $(date +%s) - T )) sn"; ls modeller | wc -l
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: durum/gecmis.pkl
          key: gecmis-x
          restore-keys: gecmis-
      - uses: actions/cache/restore@v4
        with:
          path: durum/gecmis_coin.pkl
          key: coingecmis-x
          restore-keys: coingecmis-
      - uses: actions/cache/restore@v4
        with:
          path: durum/gecmis24.pkl
          key: d24gecmis-x
          restore-keys: d24gecmis-
      - name: Zorla testler
        run: |
          set +e
          {
          echo "=== tahmin.py star, TEST_RZ=3 (🚀 → ana)"; TEST_RZ=3 TEST_ZORLA=star timeout 600 python tahmin.py > /tmp/t1.txt 2>&1; echo "exit=$?"; grep -i "Traceback\|Error" -A3 /tmp/t1.txt | head -8
          echo "=== tahmin_coin.py TEST_ZORLA=1, TEST_RZ=3 (🤝 primsizler 🚀 ana)"; TEST_RZ=3 TEST_ZORLA=1 timeout 600 python tahmin_coin.py > /tmp/c1.txt 2>&1; echo "exit=$?"; grep -i "Traceback\|Error" -A3 /tmp/c1.txt | head -8
          echo "=== tahmin_coin.py TEST_ZORLA=zit, TEST_RZ=-3 (📉🔥 öncelik)"; TEST_RZ=-3 TEST_ZORLA=zit timeout 600 python tahmin_coin.py > /tmp/c2.txt 2>&1; echo "exit=$?"; grep -i "Traceback\|Error" -A3 /tmp/c2.txt | head -8
          echo "=== tahmin24.py TEST_ZORLA=1, TEST_RZ=3"; TEST_RZ=3 TEST_ZORLA=1 timeout 400 python tahmin24.py > /tmp/d1.txt 2>&1; echo "exit=$?"; grep -i "Traceback\|Error" -A3 /tmp/d1.txt | head -8
          echo "=== tahmin24.py NORMAL"; timeout 600 python tahmin24.py > /tmp/d2.txt 2>&1; echo "exit=$?"; grep -i "Traceback\|Error" -A3 /tmp/d2.txt | head -8
          echo "=== hata dosyası"; cat durum/adim_hata.txt 2>/dev/null
          echo "=== kuyruk özeti (sınıf · öncelik · etiket)"; python -c "
          import json
          for m in json.load(open('durum/tg_kuyruk.json')): print(m.get('c'), '·', round(m['o']), '·', m['e'])
          "
          cp durum/tg_kuyruk.json /tmp/q.json
          echo "=== SENARYO 1: gün boş, tüm zorla sinyaller (altcoin adımı 'failure' gibi)"
          ADIMLAR="btc=success coin=failure d24=success" python -c "
          import gonder
          def _g(m):
              print('──── GÖNDER ────'); print(m[:1200]); return True
          gonder.tg_send = _g
          gonder.main()
          "
          echo "=== SENARYO 2: gün boş, yalnız yedekler → en iyi yedek gitmeli"
          rm -f durum/gun_durum.json; python -c "
          import json; q = json.load(open('/tmp/q.json')); json.dump([m for m in q if m.get('c') != 'ana'], open('durum/tg_kuyruk.json', 'w'))
          import gonder
          def _g(m):
              print('──── GÖNDER ────'); print(m[:1200]); return True
          gonder.tg_send = _g
          gonder.main()
          "
          echo "=== SENARYO 3: aynı gün tekrar yedekler → gitmemeli"
          python -c "
          import json; q = json.load(open('/tmp/q.json')); json.dump([m for m in q if m.get('c') == 'yedek'], open('durum/tg_kuyruk.json', 'w'))
          import gonder
          def _g(m):
              print('──── GÖNDER ────'); print(m[:300]); return True
          gonder.tg_send = _g
          gonder.main()
          "
          echo "=== panel sonu"; tail -25 son_durum.md
          } > zorla_log.txt 2>&1
          cat zorla_log.txt | head -150
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
          path: ar
      - run: |
          cp zorla_log.txt ar/ && cd ar
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add zorla_log.txt; git commit -m "Zorla sinyal kuru test sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
