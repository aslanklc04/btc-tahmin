name: Binance duyuru arsivi (Neon uzerinden)
on:
  push:
    branches: [arastirma3]
    paths: [duyuru_tetik.txt]
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - run: |
          pip install -q requests
          python -u duyuru_veri.py > duyuru_veri_log.txt 2>&1 || true; tail -8 duyuru_veri_log.txt | cut -c1-700
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add duyuru_veri_log.txt; git add duyuru_liste.json 2>/dev/null || true; git commit -m "duyuru arsivi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
