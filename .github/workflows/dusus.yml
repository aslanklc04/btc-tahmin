name: Dusus tahmini testi
on:
  push:
    branches: [arastirma3]
    paths: [dusus.py, .github/workflows/dusus.yml]
permissions:
  contents: write
  actions: read
jobs:
  egit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        sym: [BTCUSDT, ETHUSDT, BNBUSDT, DOGEUSDT, SHIBUSDT, PEPEUSDT, FLOKIUSDT, NEARUSDT, DOTUSDT, LINKUSDT, ADAUSDT, SUIUSDT, APTUSDT, ARBUSDT, OPUSDT]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python egit_coin.py ${{ matrix.sym }}
        env:
          SF_AKTAR: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: sfdus-${{ matrix.sym }}
          path: sf_${{ matrix.sym }}.pkl
          retention-days: 30
  rapor:
    needs: egit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: sfdus-*
      - uses: actions/download-artifact@v4
        with:
          path: art2
          pattern: u24-*
          run-id: 37618956269
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set +e; python dusus.py > dusus_log.txt 2>&1; echo "exit=$?" >> dusus_log.txt; tail -30 dusus_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dusus_log.txt; for f in dusus_sonuc.md dusus_tum.csv; do git add $f 2>/dev/null || true; done; git commit -m "Dusus tahmini testi sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
