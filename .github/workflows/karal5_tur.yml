name: Karal5 tur tur
on:
  push:
    branches: [arastirma3]
    paths: [karal5_tur.py, .github/workflows/karal5_tur.yml]
permissions:
  contents: write
  actions: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - uses: actions/download-artifact@v4
        with:
          path: parca
          pattern: "karal5s-*"
          run-id: 40233596671
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install -q pandas numpy && python -u karal5_tur.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add karal5_tur.md karal5_tur.json; git commit -m "Karal5 tur tur" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
