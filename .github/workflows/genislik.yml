name: Piyasa genisligi testi
on:
  push:
    branches: [arastirma3]
    paths: [genislik.py, .github/workflows/genislik.yml]
permissions:
  contents: write
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: art
          run-id: 37573562538
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python genislik.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add genislik_sonuc.md && git commit -m "Piyasa genisligi sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
