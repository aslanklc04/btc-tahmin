name: Neon uc yoklama (ham cevap)
on:
  push:
    branches: [arastirma3]
    paths: [neon_yokla_tetik.txt, .github/workflows/neon_yokla.yml]
permissions:
  contents: write
jobs:
  yokla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - run: |
          U=https://br-still-union-baibtf1k-derinlik.compute.c-8.eu-central-1.aws.neon.tech
          H=$(date -u -d '1 hour ago' +%Y%m%d%H)
          { date -u
            for p in "/" "/dene" "/saat?h=$H" "/fonlama?c=BTC,ETH" "/mum?c=BTC,PEPE,AAVE&i=1h&n=3"; do
              echo "== $p"; curl -s -m 90 -w "\nHTTP %{http_code} · %{time_total}s\n" "$U$p" | head -c 1200; echo
            done; } > neon_yokla_log.txt 2>&1
          cat neon_yokla_log.txt
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add neon_yokla_log.txt; git commit -m "Neon yoklama" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
