name: Coinbase vadeli yoklamasi
on:
  push:
    branches: [arastirma3]
    paths: [cb_vadeli_yokla.py, .github/workflows/cb_vadeli_yokla.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          set +e; timeout 900 python -u cb_vadeli_yokla.py > cb_vadeli_yokla_log.txt 2>&1; echo "exit=$?" >> cb_vadeli_yokla_log.txt; tail -60 cb_vadeli_yokla_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add cb_vadeli_yokla_log.txt; git add cb_vadeli_yokla_sonuc.md 2>/dev/null || true; git commit -m "Coinbase vadeli yoklamasi sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
