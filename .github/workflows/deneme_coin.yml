name: Altcoin deneme (Telegram'siz)
# deneme 2: paralel veri cekimi
on:
  push:
    branches: [altcoin]
    paths: [.github/workflows/deneme_coin.yml, tahmin_coin.py]
permissions:
  contents: write
jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: altcoin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Saatlik altcoin betigini iki kez dene
        run: |
          mkdir -p kayitlar
          ( time python tahmin_coin.py ) > kayitlar/coin_deneme.txt 2>&1 || true
          ( time python tahmin_coin.py ) >> kayitlar/coin_deneme.txt 2>&1 || true
          cat kayitlar/coin_deneme.txt
          git checkout -- son_durum.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add kayitlar/coin_deneme.txt && git commit -m "Altcoin deneme kaydi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin altcoin && git push origin HEAD:altcoin && break; sleep 5; done
