name: Uzun ufuk saglamlik kontrolu
on:
  push:
    branches: [arastirma3]
    paths: [ufuk24_kontrol.py, .github/workflows/ufuk24_kontrol.yml]
permissions:
  contents: write
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: u24-*
          run-id: 37618956269
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set +e; python ufuk24_kontrol.py > ufuk24_kontrol_log.txt 2>&1; echo "exit=$?" >> ufuk24_kontrol_log.txt; tail -40 ufuk24_kontrol_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ufuk24_kontrol_log.txt; git add ufuk24_kontrol_sonuc.md 2>/dev/null; git commit -m "Uzun ufuk saglamlik sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
