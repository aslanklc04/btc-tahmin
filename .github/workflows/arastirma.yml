name: Arastirma (para testi)
on:
  push:
    branches: [arastirma]
    paths: [arastirma.py, .github/workflows/arastirma.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  arastirma:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python arastirma.py
      - name: Sonucu arastirma dalina yaz
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add arastirma_sonuc.md
          git commit -m "Arastirma sonucu" || echo "degisiklik yok"
          git push origin HEAD:arastirma
