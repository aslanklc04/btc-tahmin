name: Stop veri (PROTOKOL_stop)
on:
  push:
    branches: [arastirma3]
    paths: [stop_veri.py, .github/workflows/stop_veri.yml]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - run: pip install -q requests pandas numpy
      - run: |
          set +e; timeout 13500 python -u stop_veri.py > stop_veri_log.txt 2>&1; echo "exit=$?" >> stop_veri_log.txt; tail -20 stop_veri_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add stop_veri_log.txt; for f in stop_veri.csv.gz stop_veri_ozet.md; do git add $f 2>/dev/null || true; done; git commit -m "Stop veri" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
