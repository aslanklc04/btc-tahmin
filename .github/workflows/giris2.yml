name: Giris kurali 2 (PROTOKOL_giris2)
on:
  push:
    branches: [arastirma3]
    paths: [giris2.py, giris2_analiz.py, .github/workflows/giris2.yml]
permissions:
  contents: write
jobs:
  veri:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        p: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - run: pip install -q requests pandas numpy
      - run: python -u giris2.py ${{ matrix.p }} 8 2>&1 | tail -15
      - uses: actions/upload-artifact@v4
        with: {name: "giris2-p-${{ matrix.p }}", path: "giris2_p${{ matrix.p }}.csv.gz"}
  analiz:
    needs: veri
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - uses: actions/checkout@v4
        with: {ref: main, path: canli, sparse-checkout: durum}
      - uses: actions/download-artifact@v4
        with: {path: parca, pattern: "giris2-*"}
      - run: pip install -q pandas numpy
      - run: |
          set +e; python -u giris2_analiz.py > giris2_log.txt 2>&1; echo "exit=$?" >> giris2_log.txt; tail -30 giris2_log.txt
          python -c "import glob,pandas as pd; pd.concat([pd.read_csv(p) for p in glob.glob('parca/**/giris2_p*.csv.gz',recursive=True)]).to_csv('giris2_veri.csv.gz',index=False,compression='gzip')"
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add giris2_log.txt; for f in giris2_sonuc.md giris2_veri.csv.gz; do git add $f 2>/dev/null || true; done; git commit -m "Giris2 sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
