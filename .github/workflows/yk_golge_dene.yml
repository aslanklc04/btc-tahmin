name: Yukselis golgesi deneme (arastirma3)
on:
  push:
    branches: [arastirma3]
    paths: [yk_golge_dene_tetik.txt]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          pip install -q requests pandas numpy
          mkdir -p durum; rm -f durum/yukselis_*
          set +e
          echo '{"gun": "2026-10-19", "c": {}}' > durum/yukselis_son.json
          { echo "== 20.10'dan bugüne geriye dönük deneme"; timeout 1800 python yukselis_golge_dene.py
            echo "== ikinci çalışma (değişmemeli)"; python yukselis_golge_dene.py | tail -3
            echo "== kayıt"; cat durum/yukselis_golge.csv; echo "== özet"; cat durum/yukselis_golge.md; } > yk_golge_dene_log.txt 2>&1
          tail -60 yk_golge_dene_log.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add yk_golge_dene_log.txt; git commit -m "yükseliş gölgesi deneme" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
