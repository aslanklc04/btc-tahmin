name: Emir akisi testi
on:
  push:
    branches: [arastirma3]
    paths: [emir_akisi.py, .github/workflows/emir_akisi.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt yfinance
      - run: |
          set +e; python emir_akisi.py > emir_akisi_log.txt 2>&1; echo "exit=$?" >> emir_akisi_log.txt; tail -40 emir_akisi_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add emir_akisi_log.txt; git add emir_akisi_sonuc.md 2>/dev/null; git commit -m "Emir akisi sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
