name: Kucuk ve buyuk yatirimci long
on:
  push:
    branches: [arastirma3]
    paths: [uzun_kisa.py, .github/workflows/uzun_kisa.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          set +e; python uzun_kisa.py > uzun_kisa_log.txt 2>&1; echo "exit=$?" >> uzun_kisa_log.txt; tail -60 uzun_kisa_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add uzun_kisa_log.txt; git add veri_bgeo 2>/dev/null || true; git add uzun_kisa_sonuc.md 2>/dev/null || true; git commit -m "Kucuk ve buyuk yatirimci long sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
