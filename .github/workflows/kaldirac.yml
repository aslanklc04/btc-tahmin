name: Spot alici ve kaldirac
on:
  push:
    branches: [arastirma3]
    paths: [kaldirac.py, .github/workflows/kaldirac.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          set +e; python kaldirac.py > kaldirac_log.txt 2>&1; echo "exit=$?" >> kaldirac_log.txt; tail -60 kaldirac_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add kaldirac_log.txt; git add veri_bgeo 2>/dev/null || true; git add kaldirac_sonuc.md 2>/dev/null || true; git commit -m "Spot alici ve kaldirac sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
