name: Likidite dipte genis liste ve ABD aliyor coinleri
on:
  push:
    branches: [arastirma3]
    paths: [ld_genis.py, derinlik_parca.py, .github/workflows/ld_genis.yml]
permissions:
  contents: write
  actions: read
jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        parca: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/checkout@v4
        with:
          ref: main
          path: canli
          sparse-checkout: durum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: |
          set +e; timeout 10200 python -u derinlik_parca.py ${{ matrix.parca }} 9 > dlog_${{ matrix.parca }}.txt 2>&1; echo "exit=$?" >> dlog_${{ matrix.parca }}.txt; tail -5 dlog_${{ matrix.parca }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dparca-${{ matrix.parca }}
          path: |
            derinlik_parca${{ matrix.parca }}.pkl
            dlog_${{ matrix.parca }}.txt
          retention-days: 30
  test:
    needs: indir
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/checkout@v4
        with:
          ref: main
          path: canli
          sparse-checkout: durum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Genis tarama artifact'leri
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38139240014 -R ${{ github.repository }} -p "g-*" -D ga && ls ga | wc -l
      - uses: actions/download-artifact@v4
        with:
          path: dart
          pattern: dparca-*
      - run: |
          set +e; mkdir -p ld_genis_log; cp dart/*/dlog_*.txt ld_genis_log/ 2>/dev/null; timeout 4800 python -u ld_genis.py > ld_genis_log.txt 2>&1; echo "exit=$?" >> ld_genis_log.txt; tail -40 ld_genis_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ld_genis_log.txt ld_genis_log; for f in ld_genis_sonuc.md; do git add $f 2>/dev/null || true; done; git commit -m "Likidite dipte genis liste sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
