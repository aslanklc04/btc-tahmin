name: Fiyat bosluklari testi
on:
  push:
    branches: [arastirma3]
    paths: [aciklar.py, .github/workflows/aciklar.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt yfinance
      - run: |
          set +e; python aciklar.py > aciklar_log.txt 2>&1; echo "exit=$?" >> aciklar_log.txt; tail -40 aciklar_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add aciklar_log.txt; git add aciklar_sonuc.md 2>/dev/null; git commit -m "Fiyat bosluklari sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
