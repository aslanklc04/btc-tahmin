name: Prim USDT denetimi
on:
  push:
    branches: [arastirma3]
    paths: [prim_usdt.py, .github/workflows/prim_usdt.yml]
permissions:
  contents: write
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: art1
          pattern: coin-*
          run-id: 38550403442
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: art3
          name: prim-veri
          run-id: 37771896586
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set +e; timeout 5000 python -u prim_usdt.py > prim_usdt_log.txt 2>&1; echo "exit=$?" >> prim_usdt_log.txt; tail -40 prim_usdt_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add prim_usdt_log.txt; git add prim_usdt_sonuc.md 2>/dev/null || true; git commit -m "Prim USDT denetimi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
