name: Prim gibi isaretler Kore Turkiye USDT vadeli
on:
  push:
    branches: [arastirma3]
    paths: [desen.py, .github/workflows/desen.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          set +e; python desen.py > desen_log.txt 2>&1; echo "exit=$?" >> desen_log.txt; tail -30 desen_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add desen_log.txt; for f in desen_sonuc.md; do git add $f 2>/dev/null || true; done; git commit -m "Prim gibi isaretler Kore Turkiye USDT vadeli sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
