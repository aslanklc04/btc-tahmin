name: BTC neden - veri (PROTOKOL_btcneden)
on:
  push:
    branches: [arastirma3]
    paths: [btcneden_veri.py, .github/workflows/btcneden_veri.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kos:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - run: pip install -q requests pandas numpy pyarrow yfinance lxml html5lib
      - run: |
          set +e; python -u btcneden_veri.py > btcneden_veri_log.txt 2>&1; echo "exit=$?" >> btcneden_veri_log.txt; tail -60 btcneden_veri_log.txt
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add btcneden_veri_log.txt; git add btcneden_*.parquet 2>/dev/null || true; git commit -m "BTC neden verisi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
