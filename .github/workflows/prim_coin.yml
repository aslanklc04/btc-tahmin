name: Coin kendi primi tek basina
on:
  push:
    branches: [arastirma3]
    paths: [prim_coin.py, .github/workflows/prim_coin.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: prim-veri
          run-id: ${{ vars.PRIM_RUN || '0' }}
          github-token: ${{ github.token }}
      - run: |
          set +e; python prim_coin.py > prim_coin_log.txt 2>&1; echo "exit=$?" >> prim_coin_log.txt; tail -60 prim_coin_log.txt
      - uses: actions/upload-artifact@v4
        if: hashFiles('prim_veri.pkl') != ''
        with:
          name: prim-veri
          path: prim_veri.pkl
          retention-days: 14
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add prim_coin_log.txt; git add prim_coin_tum.csv 2>/dev/null || true; git add prim_coin_sonuc.md 2>/dev/null || true; git commit -m "Coin kendi primi tek basina sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
