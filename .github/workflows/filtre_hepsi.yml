name: Ek filtre taramasi
on:
  push:
    branches: [arastirma3]
    paths: [filtre_hepsi.py, .github/workflows/filtre_hepsi.yml]
permissions:
  contents: write
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/checkout@v4
        with:
          ref: main
          path: canli
          sparse-checkout: durum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt yfinance
      - uses: actions/download-artifact@v4
        with:
          path: art1
          pattern: coin-*
          run-id: 37573562538
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: art2
          pattern: u24-*
          run-id: 37618956269
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: art3
          name: prim-veri
          run-id: 37771896586
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: BTC yuruyen test (tum ufuk cercevesi)
        continue-on-error: true
        timeout-minutes: 110
        run: python egit_coin.py BTCUSDT > filtre_hepsi_egit_log.txt 2>&1; tail -5 filtre_hepsi_egit_log.txt
        env:
          DISA_AKTAR: "1"
          SF_AKTAR: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: sf-btc
          path: sf_BTCUSDT.pkl
          retention-days: 30
      - run: |
          set +e; python filtre_hepsi.py > filtre_hepsi_log.txt 2>&1; echo "exit=$?" >> filtre_hepsi_log.txt; tail -30 filtre_hepsi_log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add filtre_hepsi_log.txt filtre_hepsi_egit_log.txt; for f in filtre_hepsi_sonuc.md filtre_hepsi_tum.csv; do git add $f 2>/dev/null || true; done; git commit -m "Ek filtre taramasi sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
