name: Kesif6d - en yakin S2 bakilmamis (PROTOKOL_kesif6c Ek)
on:
  push:
    branches: [arastirma3]
    paths: [kesif6d_analiz.py, .github/workflows/kesif6d.yml]
permissions:
  contents: write
  actions: read
jobs:
  analiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - uses: actions/download-artifact@v4
        with: {path: parca, pattern: "kesif6c-p-*", run-id: 40658239194, github-token: "${{ github.token }}"}
      - run: pip install -q pandas numpy requests
      - run: |
          set +e; python -u kesif6d_analiz.py > kesif6d_log.txt 2>&1; echo "exit=$?" >> kesif6d_log.txt; tail -40 kesif6d_log.txt
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add kesif6d_log.txt; git add kesif6d_sonuc.md 2>/dev/null || true; git add kesif6d_secim.json 2>/dev/null || true; git commit -m "Kesif6d sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
