name: Neon arsiv uyumu
on:
  push:
    branches: [arastirma3]
    paths: [neon_uyum_tetik.txt]
permissions:
  contents: write
jobs:
  uyum:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arastirma3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: |
          set +e; timeout 3000 python -u neon_uyum.py > neon_uyum_log.txt 2>&1; echo "exit=$?" >> neon_uyum_log.txt; tail -40 neon_uyum_log.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add neon_uyum_log.txt; for f in neon_uyum_sonuc.md neon_derinlik/uyumlu_coinler.txt; do git add $f 2>/dev/null || true; done; git commit -m "Neon arsiv uyumu sonucu" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
