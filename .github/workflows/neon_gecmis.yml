name: Neon kesinti gecmisi (saatlik loglardan)
on:
  push:
    branches: [arastirma3]
    paths: [.github/workflows/neon_gecmis.yml]
permissions:
  contents: write
  actions: read
jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: arastirma3}
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          : > neon_gecmis_log.txt
          for id in $(gh run list -R ${{ github.repository }} -w tahmin.yml -L 160 --json databaseId -q '.[].databaseId'); do
            t=$(gh run view $id -R ${{ github.repository }} --json createdAt -q .createdAt)
            l=$(gh run view $id -R ${{ github.repository }} --log 2>/dev/null | grep -o "💧 son saat.*\|💧 coin listesi.*" | head -1)
            echo "$t · $l" >> neon_gecmis_log.txt
          done
          sort neon_gecmis_log.txt -o neon_gecmis_log.txt; cat neon_gecmis_log.txt
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add neon_gecmis_log.txt; git commit -m "Neon kesinti gecmisi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin arastirma3 && git push origin HEAD:arastirma3 && break; sleep 5; done
